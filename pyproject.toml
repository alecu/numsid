[project]
name = "numsid"
version = "0.1.0"
description = "C64 SID and Amiga MOD player: 6502 + SID, ProTracker + Paula, emulated in Python + numpy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyglet>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
numsid = "numsid.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["numsid", "numsid.c64", "numsid.amiga", "numsid.midi"]
